# /etc/nginx/sites-available/sr-tradelink.com
# Recommended: same-origin /api proxy — no CORS needed
server {
    listen 80;
    server_name sr-tradelink.com www.sr-tradelink.com;
    return 301 https://sr-tradelink.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sr-tradelink.com www.sr-tradelink.com;

    # ssl_certificate /etc/letsencrypt/live/sr-tradelink.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sr-tradelink.com/privkey.pem;

    root /var/www/sr-tradlink-front/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /data/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
